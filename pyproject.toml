[project]
name = "p2p-process-intelligence"
version = "0.1.0"
description = "Procure-to-pay process intelligence on the BPI Challenge 2019 log: process mining, KPIs, DuckDB star schema, Streamlit dashboard and SimPy what-if simulation"
readme = "README.md"
authors = [
    { name = "kh-abrar", email = "kh.abrarr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "plotly>=7.1.0",
    "pm4py>=2.7.23.11",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "simpy>=4.1.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
